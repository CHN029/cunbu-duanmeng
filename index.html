<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>随手無常記</title>
    <link rel="stylesheet" href="./styles.css?v=20260825-98">
  </head>
  <body class="is-idle">
    <section id="cover" class="cover-screen" role="button" tabindex="0" aria-label="開始随手無常記">
      <div class="cover-title">
        <p class="cover-prefix"><span>随</span><span>手</span></p>
        <h1 class="cover-main-title" aria-label="無常記">
          <span>無</span>
          <span>常</span>
          <span>記</span>
        </h1>
      </div>
    </section>

    <div id="ui-effects" class="ui-effects" aria-hidden="true"></div>
    <main class="game-shell">
      <section class="play-area" aria-label="随手無常記棋盤">
        <div id="upcoming" class="upcoming-row" aria-label="將至"></div>
        <canvas id="game" width="300" height="423"></canvas>
      </section>

      <aside class="side-panel" aria-label="狀態">
        <div class="status-block">
          <div class="round-actions">
            <p id="round" class="round-value">第一回</p>
            <button id="new-run" type="button">週而復始</button>
          </div>
          <div class="stats-row">
            <div class="stat-item body-meter-section">
              <p class="label">體</p>
              <div class="stat-value-row">
                <div id="body-meter" class="body-meter" aria-label="體魄與根骨"></div>
              </div>
            </div>
            <div class="stat-item">
              <p class="label">寶</p>
              <p id="treasure" class="value">無</p>
            </div>
            <div class="blessings-section">
              <div id="blessings" class="blessing-tags" aria-label="已得福澤"></div>
            </div>
          </div>
        </div>
        <div class="hidden-dev-controls">
          <button id="show-shop" type="button">暫看行商</button>
        </div>
      </aside>
    </main>

    <button id="pause-run" class="mobile-pause" type="button" aria-label="暫歇" hidden>歇</button>

    <script type="module" src="./src/main.js?v=20260825-32"></script>
  </body>
</html>
